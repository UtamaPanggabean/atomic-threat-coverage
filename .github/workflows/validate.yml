name: Validate SOC knowledge base

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.11"
          cache: pip
      - run: python -m pip install --requirement requirements-dev.txt
      - run: python scripts/verify_pins.py
      - run: python -m soc_kb.cli validate
      - run: pytest -q
